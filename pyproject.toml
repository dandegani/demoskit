[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "demoskit"
version = "0.3.1"
description = "Shared building blocks for Demos products on Agno: claude_agent, make_os."
requires-python = ">=3.11"
dependencies = ["agno==3.1.12", "claude-agent-sdk", "sqlalchemy[asyncio]"]

[project.optional-dependencies]
postgres = ["psycopg[binary]", "pgvector"]

[tool.setuptools.packages.find]
include = ["demoskit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
