[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "demoskit"
version = "0.1.0"
description = "Shared building blocks for Demos products on Agno: claude_agent, make_os."
requires-python = ">=3.11"
dependencies = ["agno==3.1.6", "claude-agent-sdk"]

[project.optional-dependencies]
postgres = ["psycopg[binary]", "pgvector"]

[tool.setuptools.packages.find]
include = ["demoskit*"]
